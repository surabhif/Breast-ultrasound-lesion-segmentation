name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + unit tests
        run: npm run test
      - name: Build (Pages base path)
        env:
          VITE_BASE: /Breast-ultrasound-lesion-segmentation/
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Parity tests (browser vs Python reference)
        env:
          VITE_BASE: /Breast-ultrasound-lesion-segmentation/
        run: npm run test:parity

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install CPU torch + deps
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt
      - name: Smoke tests
        run: python scripts/test_smoke.py
      - name: Morphology / versioning parity checks
        run: python scripts/test_parity_morphology.py
      - name: Report PDF number drift check
        run: |
          python -m pip install reportlab pypdf
          python scripts/check_report_pdf_drift.py
